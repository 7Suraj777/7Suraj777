<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rice Rusika Rusika — Menu</title>
<style>
/* ------------------------------------------------------------------ */
/*  Type                                                               */
/* ------------------------------------------------------------------ */
@font-face { font-family: "Fraunces Display"; src: url(fonts/Fraunces-Display-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Fraunces Display"; src: url(fonts/Fraunces-Display-Bold.ttf); font-weight: 700; }
@font-face { font-family: "Fraunces Display"; src: url(fonts/Fraunces-Display-MediumItalic.ttf); font-weight: 500; font-style: italic; }
@font-face { font-family: "Fraunces Text"; src: url(fonts/Fraunces-Text-SemiBold.ttf); font-weight: 600; }
@font-face { font-family: "Fraunces Text"; src: url(fonts/Fraunces-Text-Italic.ttf); font-weight: 400; font-style: italic; }
@font-face { font-family: "Jost"; src: url(fonts/Jost-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Jost"; src: url(fonts/Jost-Medium.ttf); font-weight: 500; }
@font-face { font-family: "Jost"; src: url(fonts/Jost-SemiBold.ttf); font-weight: 600; }
/* Tamil faces cover only the Tamil block, so digits / Latin fall through to the English faces */
@font-face { font-family: "TA Serif"; src: url(fonts/NotoSerifTamil-Medium.ttf); font-weight: 500; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }
@font-face { font-family: "TA Serif"; src: url(fonts/NotoSerifTamil-SemiBold.ttf); font-weight: 600; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }
@font-face { font-family: "TA Serif"; src: url(fonts/NotoSerifTamil-Bold.ttf); font-weight: 700; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }
@font-face { font-family: "TA Sans"; src: url(fonts/NotoSansTamil-Regular.ttf); font-weight: 400; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }
@font-face { font-family: "TA Sans"; src: url(fonts/NotoSansTamil-Medium.ttf); font-weight: 500; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }
@font-face { font-family: "TA Sans"; src: url(fonts/NotoSansTamil-SemiBold.ttf); font-weight: 600; unicode-range: U+0B80-0BFF, U+200C-200D, U+25CC; }

/* ------------------------------------------------------------------ */
/*  Brand tokens                                                       */
/* ------------------------------------------------------------------ */
:root {
  --leaf-900: #142B1C;
  --leaf-800: #1C3A27;
  --leaf-700: #27503A;
  --leaf-600: #3A6A48;
  --leaf-tint: #E7E8D3;
  --gold: #D6A443;
  --gold-deep: #A7771F;
  --gold-soft: #EDCF8C;
  --chilli: #A8402A;
  --paper: #F7F0E0;
  --paper-hi: #FCF8EF;
  --rule: #D9C9A3;
  --ink: #2A2118;
  --ink-soft: #6A5A43;

  --f-display: "Fraunces Display", Georgia, serif;
  --f-text: "Fraunces Text", Georgia, serif;
  --f-sans: "Jost", "Helvetica Neue", Arial, sans-serif;
}
.ta {
  --f-display: "TA Serif", "Fraunces Display", serif;
  --f-text: "TA Serif", "Fraunces Text", serif;
  --f-sans: "TA Sans", "Jost", sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { -webkit-print-color-adjust: exact; print-color-adjust: exact; color: var(--ink); font-family: var(--f-sans); }

/* ------------------------------------------------------------------ */
/*  Page geometry: sheet = A4 trim (210x297) + 3 mm bleed each side    */
/* ------------------------------------------------------------------ */
.page { position: relative; overflow: hidden; break-after: page; page-break-after: always; background: #fff; }
.page:last-child { break-after: auto; page-break-after: auto; }
body.mode-a4 .page    { width: 210mm; height: 297mm; }
body.mode-a4 .sheet   { left: -3mm; top: -3mm; }
body.mode-print .page { width: 236mm; height: 323mm; }
body.mode-print .sheet{ left: 10mm; top: 10mm; }

@media screen {
  body { background: #8a8578; padding: 10mm 0; }
  .page { margin: 0 auto 10mm; box-shadow: 0 2mm 8mm rgba(0,0,0,.35); }
}

.sheet { position: absolute; width: 216mm; height: 303mm; overflow: hidden; background: var(--paper); }

/* ------------------------------------------------------------------ */
/*  Masthead                                                           */
/* ------------------------------------------------------------------ */
.mast { position: absolute; left: 0; top: 0; width: 216mm; height: 63mm; color: var(--paper-hi); overflow: hidden; }
.mast-bg { position: absolute; inset: 0; width: 216mm; height: 63mm; }
.mast .leaf { position: absolute; transform-origin: 50% 100%; }
.brand { position: absolute; left: 16mm; top: 11.5mm; display: flex; flex-direction: column; align-items: flex-start; }
.brand-top { display: flex; align-items: center; gap: 2.4mm; }
.brand .pot { width: 10mm; height: 10mm; color: var(--gold); margin-bottom: .8mm; }
.overline {
  display: flex; align-items: center; gap: 3mm;
  font: 500 8.6pt/1 var(--f-sans); letter-spacing: .62em; text-transform: uppercase; color: var(--gold-soft);
}
.overline::after { content: ""; width: 16mm; height: .3mm; background: var(--gold); opacity: .8; }
.wordmark { margin-top: 2.2mm; font: 600 44pt/0.95 var(--f-display); letter-spacing: -.012em; color: #FBF4E4; }
.tagline { margin-top: 3mm; font: italic 500 13.6pt/1 var(--f-display); color: var(--gold-soft); letter-spacing: .01em; }

.ta .overline { font-size: 9.4pt; letter-spacing: .04em; }
.ta .wordmark { font-weight: 700; font-size: 34pt; line-height: 1.12; letter-spacing: 0; margin-top: 1mm; }
.ta .tagline { font-family: "TA Serif", "Fraunces Display", serif; font-style: normal; font-weight: 500; font-size: 12pt; margin-top: 2mm; }

/* round "plate" photos: cream rim, gold hairline, flat vector shadow */
.pw { position: absolute; }
.pw .ps { position: absolute; inset: 0; border-radius: 50%; background: #10261A; opacity: .3; transform: translate(.7mm, 1.2mm); }
.pw .pl { position: absolute; inset: 0; border-radius: 50%; background: #F7F0E0; overflow: hidden; }
.pw .pl img { position: absolute; inset: var(--rim, 1.6mm); width: calc(100% - 2 * var(--rim, 1.6mm)); height: calc(100% - 2 * var(--rim, 1.6mm)); border-radius: 50%; object-fit: cover; object-position: var(--pos, 50% 50%); display: block; }
.pw .pr { position: absolute; inset: calc(var(--rim, 1.6mm) - .25mm); border-radius: 50%; border: .3mm solid var(--gold); }
.pw.hero { left: 140mm; top: 5mm; width: 67mm; height: 67mm; --rim: 2mm; }

/* mango-leaf thoranam hanging from the masthead */
.thoranam { position: absolute; left: 0; top: 60.5mm; width: 216mm; height: 10mm; }

/* seal */
.seal { position: absolute; width: 30mm; height: 30mm; left: 125mm; top: 44mm; transform: rotate(-9deg); }

/* ------------------------------------------------------------------ */
/*  Content area                                                       */
/* ------------------------------------------------------------------ */
.content {
  position: absolute; left: 13mm; right: 13mm; top: 77.5mm; bottom: 31mm;
  display: flex; flex-direction: column; justify-content: space-between;
}

.section-head { display: flex; align-items: flex-end; gap: 4mm; padding-top: .6mm; }
.section-head h2 { font: 600 23pt/1 var(--f-display); color: var(--leaf-800); letter-spacing: -.005em; }
.section-head .flourish { width: 26mm; height: 4mm; color: var(--gold-deep); margin-bottom: 1.2mm; }
.ta .section-head h2 { font-size: 19pt; font-weight: 700; line-height: 1.25; }

/* the weekly table */
.week { --day-col: 31mm; --vr-col: 63mm; --row-pad: 1.85mm; display: grid; grid-template-columns: var(--day-col) minmax(0, 1fr) var(--vr-col); }
.ta .week { --day-col: 30.5mm; --vr-col: 59mm; --row-pad: 1.55mm; }
.week .th-left { grid-column: 1 / span 2; display: flex; flex-direction: column; justify-content: space-between; gap: 4mm; border-bottom: .45mm solid var(--leaf-800); }
.week .th-left .labels { display: grid; grid-template-columns: var(--day-col) 1fr; }
.week .th {
  font: 600 7.4pt/1 var(--f-sans); letter-spacing: .26em; text-transform: uppercase; color: var(--leaf-700);
  padding: 0 0 2.4mm;
}
.ta .week .th { font-size: 8.6pt; letter-spacing: 0; }
.ta .week .th.vr { letter-spacing: 0; font-size: 8.8pt; }
.week .th.vr {
  align-self: stretch; border: none; border-radius: 2.4mm 2.4mm 0 0;
  background: var(--leaf-800); color: var(--gold-soft); padding: 3mm 4.2mm 3mm; letter-spacing: .26em;
}
.week .th.vr .note {
  display: block; margin-top: 1.6mm; text-transform: none; letter-spacing: 0;
  font: italic 400 8pt/1.32 var(--f-text); color: #EFE6CF;
}
.ta .week .th.vr .note { font: 400 7.3pt/1.42 var(--f-sans); }

.week .td { padding: var(--row-pad) 0; border-bottom: .25mm dotted var(--rule); display: flex; align-items: center; }
.week .td.day { font: 600 12.5pt/1 var(--f-display); color: var(--leaf-800); gap: 2.2mm; }
.week .td.day .gem { width: 2mm; height: 2mm; color: var(--gold-deep); flex: none; }
.ta .week .td.day { font-size: 10.6pt; font-weight: 600; gap: 1.8mm; }
.week .td.lunch { font: 400 9.5pt/1.5 var(--f-sans); color: var(--ink); padding-right: 4mm; display: block; align-self: stretch; }
.week .td.lunch .wrap { display: flex; align-items: center; height: 100%; }
.week .td.lunch p { display: block; }
.ta .week .td.lunch { font-size: 8.5pt; line-height: 1.55; }
.it { white-space: nowrap; }
.sep { color: var(--gold-deep); padding-left: 1.5mm; font-weight: 600; }
.it { margin-right: .3mm; }

.week .td.vr { background: var(--leaf-tint); padding-left: 4.2mm; padding-right: 3mm; border-bottom-color: #C9CCAE; display: block; }
.week .td.vr .wrap { display: flex; flex-direction: column; justify-content: center; height: 100%; }
.week .td.vr.last { border-bottom: none; border-radius: 0 0 2.4mm 2.4mm; }
.week .td.last { border-bottom: none; }
.dish { font: 600 10.6pt/1.2 var(--f-text); color: var(--leaf-900); }
.ta .dish { font-size: 9.6pt; line-height: 1.35; }
.qty { font: 500 7pt/1 var(--f-sans); color: var(--gold-deep); letter-spacing: .06em; white-space: nowrap; margin-left: 1.2mm; }
.dish-plus { font: 400 8.2pt/1.3 var(--f-sans); color: var(--ink-soft); margin-top: .6mm; }

/* sign-off */
.signoff { display: flex; align-items: center; justify-content: center; gap: 3mm; font: italic 500 12.5pt/1 var(--f-display); color: var(--leaf-700); margin: 0 0 0; }
.signoff .heart { width: 3.4mm; height: 3.4mm; color: var(--chilli); }
.signoff .rule { width: 22mm; height: 2.4mm; color: var(--gold-deep); }
.ta .signoff { font: 600 11pt/1.2 var(--f-display); }

/* the two feature cards: full width, each with a photo plate */
.cards { display: flex; flex-direction: column; gap: 4.2mm; }
.card { position: relative; border-radius: 2.6mm; display: flex; align-items: center; gap: 6mm; padding: 4.4mm 6.6mm; }
.card .pw { position: relative; flex: none; width: 36mm; height: 36mm; margin: -5mm 0; }
.card-body { flex: 1; min-width: 0; }
.card h3 { font: 600 17pt/1.05 var(--f-display); letter-spacing: -.005em; }
.ta .card h3 { font-size: 13pt; font-weight: 700; line-height: 1.3; }
.card .kicker { font: 600 6.8pt/1.3 var(--f-sans); letter-spacing: .22em; text-transform: uppercase; margin-bottom: 1.6mm; }
.ta .card .kicker { font-size: 7.2pt; letter-spacing: 0; font-weight: 500; }

.card.power { background: var(--leaf-800); color: #F6EEDC; }
.card.power::after { content: ""; position: absolute; inset: 1.7mm; border: .25mm solid rgba(214,164,67,.55); border-radius: 1.6mm; pointer-events: none; }
.card.power .pw { margin-left: -1mm; }
.card.power .kicker { color: var(--gold); }
.card.power h3 { color: #FBF4E4; }
.card.power ul { list-style: none; display: flex; flex-wrap: wrap; gap: 1.8mm 5mm; margin-top: 3.2mm; }
.card.power li { display: flex; gap: 1.6mm; align-items: center; font: 400 9.4pt/1.3 var(--f-sans); white-space: nowrap; }
.ta .card.power li { font-size: 8.5pt; line-height: 1.45; }
.card.power li svg { width: 3mm; height: 3mm; flex: none; color: var(--gold); }
.badge { position: absolute; left: 27.5mm; bottom: -3.5mm; width: 19.5mm; height: 19.5mm; transform: rotate(9deg); z-index: 2; }

.card.conti { background: var(--paper-hi); border: .3mm solid var(--rule); }
.card.conti .pw { margin-right: -1mm; }
.card.conti h3 { color: var(--leaf-800); }
.card.conti .corner { position: absolute; width: 6mm; height: 6mm; color: var(--gold-deep); }
.card.conti .corner.tl { left: 1.6mm; top: 1.6mm; }
.card.conti .corner.bl { left: 1.6mm; bottom: 1.6mm; transform: scaleY(-1); }
.conti-list { display: grid; grid-template-columns: minmax(0, 1.45fr) repeat(3, minmax(0, 1fr)); gap: 3mm 4mm; margin-top: 3.4mm; }
.conti-list .origin { font: 600 6.6pt/1 var(--f-sans); letter-spacing: .24em; text-transform: uppercase; color: var(--gold-deep); display: flex; align-items: center; gap: 1.6mm; }
.conti-list .origin::before { content: ""; width: 3mm; height: .3mm; background: var(--gold-deep); }
.ta .conti-list .origin { font-size: 7.4pt; letter-spacing: 0; font-weight: 600; }
.conti-list .name { font: 600 10.2pt/1.22 var(--f-text); color: var(--leaf-900); margin-top: 1.3mm; }
.ta .conti-list .name { font-size: 8.8pt; line-height: 1.42; }
.conti-list .name em { display: block; font: italic 400 8.4pt/1.3 var(--f-text); color: var(--ink-soft); margin-top: .5mm; }
.ta .conti-list .name em { font: 400 8pt/1.4 var(--f-sans); }

/* ------------------------------------------------------------------ */
/*  Footer                                                             */
/* ------------------------------------------------------------------ */
.foot { position: absolute; left: 0; bottom: 0; width: 216mm; height: 27mm; background: var(--leaf-800); color: #F3EBD6; }
.foot .edge { position: absolute; left: 0; top: 0; width: 216mm; height: 2.6mm; }
.foot-inner { position: absolute; left: 13mm; right: 13mm; top: 5.2mm; display: flex; flex-direction: column; align-items: center; gap: 3mm; }
.foot .motto { display: flex; align-items: center; gap: 2.6mm; font: italic 500 11.2pt/1 var(--f-display); color: var(--gold-soft); }
.ta .foot .motto { font: 500 10pt/1.3 var(--f-display); }
.foot .motto .dot { width: 1.6mm; height: 1.6mm; color: var(--gold); }
.foot .contact { display: flex; align-items: center; gap: 5mm; font: 400 9.6pt/1.2 var(--f-sans); letter-spacing: .02em; }
.ta .foot .contact { font-size: 9pt; }
.foot .contact span { display: inline-flex; align-items: center; gap: 1.8mm; }
.foot .contact svg { width: 3.6mm; height: 3.6mm; color: var(--gold); flex: none; }
.foot .contact b { font-weight: 600; letter-spacing: .12em; color: var(--gold-soft); }
.foot .contact .vline { width: .25mm; height: 4.2mm; background: rgba(214,164,67,.6); }
.foot .phone { font-weight: 600; letter-spacing: .06em; color: #FBF4E4; }

/* ------------------------------------------------------------------ */
/*  Printer's marks (print mode only)                                  */
/* ------------------------------------------------------------------ */
.marks { position: absolute; inset: 0; pointer-events: none; display: none; }
body.mode-print .marks { display: block; }
.marks i { position: absolute; background: #000; }
.marks .slug { position: absolute; left: 26mm; bottom: 4mm; font: 400 6.5pt/1 "Jost", sans-serif; color: #000; letter-spacing: .03em; }
</style>
</head>
<body>

<!-- Shared vector artwork -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- kolam: dots with interlaced loops -->
    <pattern id="kolam" width="9" height="9" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#D6A443" stroke-width=".22">
        <circle cx="0" cy="0" r="3.15"/><circle cx="9" cy="0" r="3.15"/>
        <circle cx="0" cy="9" r="3.15"/><circle cx="9" cy="9" r="3.15"/>
        <path d="M4.5 1.9 L7.1 4.5 L4.5 7.1 L1.9 4.5 Z"/>
      </g>
      <circle cx="4.5" cy="4.5" r=".42" fill="#D6A443"/>
      <circle cx="0" cy="0" r=".3" fill="#D6A443"/><circle cx="9" cy="0" r=".3" fill="#D6A443"/>
      <circle cx="0" cy="9" r=".3" fill="#D6A443"/><circle cx="9" cy="9" r=".3" fill="#D6A443"/>
    </pattern>
    <radialGradient id="kolamFade" cx=".5" cy=".42" r=".62">
      <stop offset=".28" stop-color="#000"/>
      <stop offset=".9" stop-color="#fff"/>
    </radialGradient>
    <mask id="kolamMask" maskContentUnits="objectBoundingBox">
      <rect width="1" height="1" fill="url(#kolamFade)"/>
    </mask>
    <clipPath id="leafClip"><path d="M60 420 C 10 372 2 128 60 0 C 118 128 110 372 60 420 Z"/></clipPath>
  </defs>

  <!-- banana leaf (built by script: veins + splits) -->
  <symbol id="banana" viewBox="0 0 120 420">
    <g clip-path="url(#leafClip)">
      <path d="M60 420 C 10 372 2 128 60 0 Z" fill="#26503A"/>
      <path d="M60 420 C 110 372 118 128 60 0 Z" fill="#2F5E40"/>
      <g id="bananaVeins" fill="none" stroke-linecap="round"></g>
    </g>
    <path d="M58.6 420 L61.4 420 L60.35 6 L59.65 6 Z" fill="#4C7F57"/>
  </symbol>

  <!-- clay pot with steam: brand emblem -->
  <symbol id="pot" viewBox="0 0 48 48">
    <g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19.2 12.6c-1.7-1.7 1.7-3.3 0-5"/>
      <path d="M24 11.4c-1.9-1.9 1.9-3.8 0-5.7"/>
      <path d="M28.8 12.6c-1.7-1.7 1.7-3.3 0-5"/>
      <path d="M14.2 21.2c2.1-4.3 5.8-6.2 9.8-6.2s7.7 1.9 9.8 6.2"/>
      <path d="M12.4 21.2h23.2v3H12.4z"/>
      <path d="M15.2 24.2c-5.2 2.8-7 8.3-5 12.8 1.9 4.2 6.8 6.5 13.8 6.5s11.9-2.3 13.8-6.5c2-4.5.2-10-5-12.8"/>
      <path d="M10.6 31.6c4.2 1.6 8.7 2.3 13.4 2.3s9.2-.7 13.4-2.3"/>
    </g>
    <g fill="currentColor"><circle cx="17" cy="37.3" r="1"/><circle cx="24" cy="38" r="1"/><circle cx="31" cy="37.3" r="1"/></g>
  </symbol>

  <symbol id="heart" viewBox="0 0 24 24"><path fill="currentColor" d="M12 21.2s-7.6-4.7-9.7-9.3C.8 8.3 3 4.4 6.9 4.4c2.2 0 3.8 1.2 5.1 3 1.3-1.8 2.9-3 5.1-3 3.9 0 6.1 3.9 4.6 7.5-2.1 4.6-9.7 9.3-9.7 9.3z"/></symbol>
  <symbol id="gem" viewBox="0 0 10 10"><path fill="currentColor" d="M5 0 L10 5 L5 10 L0 5 Z"/></symbol>
  <symbol id="leafBullet" viewBox="0 0 16 16"><path fill="currentColor" d="M2 14C2 6.8 6.8 2 14 2c0 7.2-4.8 12-12 12z"/><path d="M3.2 12.8 10.6 5.4" stroke="#1C3A27" stroke-width="1.1" stroke-linecap="round"/></symbol>
  <symbol id="pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21.5s6.8-6.3 6.8-11.7a6.8 6.8 0 1 0-13.6 0c0 5.4 6.8 11.7 6.8 11.7z"/><circle cx="12" cy="9.8" r="2.5"/></g></symbol>
  <symbol id="phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M6.6 3.5h2.6l1.5 4.2-2 1.4a12 12 0 0 0 6.2 6.2l1.4-2 4.2 1.5v2.6a2 2 0 0 1-2.2 2C10.8 18.9 5.1 13.2 4.6 5.7a2 2 0 0 1 2-2.2z"/></symbol>
  <symbol id="flourish" viewBox="0 0 104 16"><g fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"><path d="M2 8h34"/><path d="M36 8c6-7 12-7 16 0s10 7 16 0"/><path d="M68 8h34"/></g><path fill="currentColor" d="M52 4.6 55.4 8 52 11.4 48.6 8z"/></symbol>
  <symbol id="rule" viewBox="0 0 88 10"><g fill="currentColor"><path d="M0 4.6h80v.8H0z"/><path d="M84 1.6 87.4 5 84 8.4 80.6 5z"/></g></symbol>
  <symbol id="corner" viewBox="0 0 28 28"><g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round"><path d="M2 26V8a6 6 0 0 1 6-6h18"/><path d="M6 26V12a6 6 0 0 1 6-6h14"/></g><path fill="currentColor" d="M2 2.2 4.2 0 6.4 2.2 4.2 4.4z" transform="translate(-.2 -.2)"/></symbol>

<div id="root"></div>

<script>
/* ==================================================================
   CONTENT — wording kept exactly as the existing menu
   ================================================================== */
const MENU = {
  en: {
    lang: "en",
    rice: "Rice",
    brand: "Rusika Rusika",
    tagline: "Food for Taste and for Soul",
    seal: "KALYANA SAMAYAL SADHAM • WHOLESOME MEALS EVERY DAY •",
    weekly: "Weekly Menu",
    thDay: "Days", thLunch: "Lunch", thVariety: "Variety Rice Menu",
    varietyNote: "Every variety rice comes with Curd Rice / Rasam Rice (150gms), Pickle and Papad.",
    days: [
      { day: "Monday",    lunch: ["Rice","Sambar","Rasam","Poriyal","Kootu","Pickle","Butter Milk","Chapati","Kuruma"], rice: "Milagu Rice", qty: "350gms" },

/* ==================================================================
   ARTWORK HELPERS
   ================================================================== */
const use = (id, cls = "", extra = "") => `<svg class="${cls}" ${extra}><use href="#${id}"/></svg>`;
const plate = (p, cls = "") => `<div class="pw ${cls}" style="--pos:${p.pos}"><i class="ps"></i><div class="pl"><img src="${p.src}" alt=""></div><i class="pr"></i></div>`;

// banana leaf veins + natural splits, drawn once into the shared symbol
(function buildBananaVeins() {
  const g = document.getElementById("bananaVeins");
  let out = "";
  const splitsL = new Set([9, 22, 31, 44]);
  const splitsR = new Set([6, 17, 27, 38, 47]);
  let i = 0;
  for (let y = 404; y > 18; y -= 7.4, i++) {
    const rise = 26 + (420 - y) * 0.02;
    out += `<path d="M60 ${y} Q34 ${y - 7} 0 ${y - rise}" stroke="#1A3826" stroke-opacity=".42" stroke-width=".7"/>`;
    out += `<path d="M60 ${y} Q86 ${y - 7} 120 ${y - rise}" stroke="#1A3826" stroke-opacity=".36" stroke-width=".7"/>`;
    if (splitsL.has(i)) out += `<path d="M-2 ${y - rise - 0.5} Q20 ${y - 13} 34 ${y - 7.2}" stroke="#1C3A27" stroke-width="2.3"/>`;
    if (splitsR.has(i)) out += `<path d="M122 ${y - rise - 0.5} Q100 ${y - 13} 82 ${y - 6.4}" stroke="#1C3A27" stroke-width="2.3"/>`;
  }
  g.innerHTML = out;
})();

// a banana leaf whose stem sits at (x, y) mm, pointing at `deg` (0 = straight up), `len` mm long
function leaf(x, y, deg, len, mirror = false) {
  const w = len * 0.286;
  return use("banana", "leaf", `style="left:${x - w / 2}mm; top:${y - len}mm; width:${w}mm; height:${len}mm; transform: rotate(${deg}deg)${mirror ? " scaleX(-1)" : ""};"`);
}

function mastheadArt() {
  // 216 x 63 mm, user units = mm
  return `
  <svg class="mast-bg" viewBox="0 0 216 63">
    <rect width="216" height="63" fill="#1C3A27"/>
    <rect width="216" height="63" fill="url(#kolam)" opacity=".11"/>
  </svg>
  ${leaf(173.5, 38.5, -60, 64)}${leaf(173.5, 38.5, -102, 60, true)}${leaf(173.5, 38.5, 24, 62, true)}${leaf(173.5, 38.5, 112, 58)}${leaf(173.5, 38.5, -18, 60)}
  `;
}

function thoranam() {
  // a gold cord with mango leaves + marigold beads, 216mm wide
  let s = `<svg class="thoranam" viewBox="0 0 216 10">`;
  s += `<path d="M0 2.5 H216" stroke="#D6A443" stroke-width=".5"/>`;
  s += `<path d="M0 1.3 H216" stroke="#D6A443" stroke-width=".18" opacity=".8"/>`;
  const step = 7.2;
  let k = 0;
  for (let x = 3.6; x < 216; x += step, k++) {
    const long = k % 2 === 0;
    const L = long ? 7.4 : 5.6, W = long ? 2.4 : 2.0;
    const fill = long ? "#27503A" : "#3A6A48";
    s += `<path d="M${x} 2.5 C ${x - W} ${2.5 + L * 0.35} ${x - W * 0.6} ${2.5 + L * 0.8} ${x} ${2.5 + L} C ${x + W * 0.6} ${2.5 + L * 0.8} ${x + W} ${2.5 + L * 0.35} ${x} 2.5 Z" fill="${fill}"/>`;
    s += `<path d="M${x} 2.9 V ${2.5 + L - 0.8}" stroke="#D6A443" stroke-opacity=".45" stroke-width=".18"/>`;
    const bx = x + step / 2;
    if (bx < 216) s += `<circle cx="${bx}" cy="2.5" r="${k % 2 ? 1.05 : 0.8}" fill="${k % 2 ? '#E0952F' : '#D6A443'}"/>`;
  }
  return s + `</svg>`;
}

function seal(d) {
  const id = `sealPath-${d.lang}`;
  const r = 14.4, C = 2 * Math.PI * r;
  const fs = d.lang === "ta" ? 2.55 : 2.85;
  return `
  <svg class="seal" viewBox="0 0 40 40">
    <defs><path id="${id}" d="M20 20 m-${r} 0 a${r} ${r} 0 1 1 ${2 * r} 0 a${r} ${r} 0 1 1 -${2 * r} 0"/></defs>
    <circle cx="20.25" cy="20.6" r="19.5" fill="#142B1C" opacity=".22"/>
    <circle cx="20" cy="20" r="19.5" fill="#F7F0E0"/>
    <circle cx="20" cy="20" r="18.6" fill="none" stroke="#A7771F" stroke-width=".35"/>
    <circle cx="20" cy="20" r="18.1" fill="none" stroke="#A7771F" stroke-width=".15"/>
    <text class="seal-text" data-len="${(C - 0.8).toFixed(2)}" data-lang="${d.lang}" font-family="${d.lang === "ta" ? "TA Sans, Jost" : "Jost"}" font-weight="600" font-size="${fs}" fill="#1C3A27" letter-spacing="${d.lang === "ta" ? 0 : .35}">
      <textPath href="#${id}">${d.seal}</textPath>
    </text>
    <circle cx="20" cy="20" r="11.3" fill="#1C3A27"/>
    <circle cx="20" cy="20" r="10.3" fill="none" stroke="#D6A443" stroke-width=".25" stroke-dasharray=".5 .7"/>
    <svg x="13.2" y="12.6" width="13.6" height="13.6" color="#D6A443"><use href="#pot"/></svg>
  </svg>`;
}

function badge(d) {
  const ta = d.lang === "ta";
  const lines = d.power.badge;
  const fs = ta ? [3.4, 3.9, 3.9] : [3.3, 4.6, 3.3];
  const ys = ta ? [16.5, 21.6, 26.4] : [16.4, 21.6, 26.2];
  const fam = ta ? "TA Sans, Jost" : "Jost";
  return `
  <svg class="badge" viewBox="0 0 40 40">
    <circle cx="20.25" cy="20.6" r="19.6" fill="#000" opacity=".25"/>
    <circle cx="20" cy="20" r="19.6" fill="#D6A443"/>
    <circle cx="20" cy="20" r="17.9" fill="none" stroke="#1C3A27" stroke-width=".35" stroke-dasharray="1 .8"/>
    <svg x="16.6" y="6.2" width="6.8" height="6.8" color="#1C3A27"><use href="#leafBullet"/></svg>
    ${lines.map((t, i) => `<text x="20" y="${ys[i]}" text-anchor="middle" font-family="${fam}" font-weight="${ta ? 600 : (i === 1 ? 600 : 500)}" font-size="${fs[i]}" letter-spacing="${ta ? 0 : (i === 1 ? .5 : .9)}" fill="#1C3A27">${t}</text>`).join("")}
    <path d="M13 29.4h14" stroke="#1C3A27" stroke-width=".3"/>
  </svg>`;
}

function footEdge() {
  return `<svg class="edge" viewBox="0 0 216 2.6" preserveAspectRatio="none">
    <rect width="216" height=".55" fill="#D6A443"/>
    <rect y="1.2" width="216" height=".18" fill="#D6A443" opacity=".8"/>
  </svg>`;
}

function cropMarks() {
  // trim box sits at 13mm inset on a 236 x 323 mm page; marks stay outside the 3mm bleed
  const T = 13, W = 210, H = 297, len = 6, off = 3.2, th = "0.25pt";
  const xs = [T, T + W], ys = [T, T + H];
  let m = "";
  for (const x of xs) for (const y of ys) {
    const left = x === T;
    const top = y === T;
    // horizontal mark
    m += `<i style="height:${th}; width:${len}mm; top:calc(${y}mm - 0.125pt); left:${left ? (x - off - len) : (x + off)}mm"></i>`;
    // vertical mark
    m += `<i style="width:${th}; height:${len}mm; left:calc(${x}mm - 0.125pt); top:${top ? (y - off - len) : (y + off)}mm"></i>`;
  }
  return m;
}

/* ==================================================================
   PAGE TEMPLATE
   ================================================================== */
function renderPage(d) {
  const sep = `<span class="sep">·</span>`;
  const rows = d.days.map((r, i) => {
    const last = i === d.days.length - 1 ? " last" : "";
    const lunch = r.lunch.map((x, j) => `<span class="it">${x}${j < r.lunch.length - 1 ? sep : ""}</span>`).join(" ");
    const plus = r.plus ? `<div class="dish-plus">${r.plus} <span class="qty" style="margin-left:.6mm">${r.plusQty}</span></div>` : "";
    return `
      <div class="td day${last}">${use("gem", "gem")}<span>${r.day}</span></div>
      <div class="td lunch${last}"><div class="wrap"><p>${lunch}</p></div></div>
      <div class="td vr${last}"><div class="wrap"><div class="dish">${r.rice}<span class="qty">${r.qty}</span></div>${plus}</div></div>`;
  }).join("");

  const powerItems = d.power.items.map(x => `<li>${use("leafBullet")}<span>${x}</span></li>`).join("");
  const contiItems = d.conti.items.map(x => `
      <div><div class="origin">${x.origin}</div><div class="name">${x.name}${x.note ? `<em>${x.note}</em>` : ""}</div></div>`).join("");

  return `
  <div class="page">
    <section class="sheet ${d.lang}" lang="${d.lang}">
      <header class="mast">
        ${mastheadArt()}
        <div class="brand">
          <div class="brand-top">${use("pot", "pot")}<div class="overline">${d.rice}</div></div>
          <h1 class="wordmark">${d.brand}</h1>
          <div class="tagline">${d.tagline}</div>
        </div>
      </header>
      ${thoranam()}
      ${plate(PHOTOS.hero, "hero")}
      ${seal(d)}

      <main class="content">
        <div>
          <div class="week">
            <div class="th-left">
              <div class="section-head"><h2>${d.weekly}</h2>${use("flourish", "flourish")}</div>
              <div class="labels"><div class="th day">${d.thDay}</div><div class="th lunch">${d.thLunch}</div></div>
            </div>
            <div class="th vr">${d.thVariety}<span class="note">${d.varietyNote}</span></div>
            ${rows}
          </div>
        </div>

        <div class="signoff">${use("rule", "rule", `style="transform:scaleX(-1)"`)}<span>${d.signoff[0]}</span>${use("heart", "heart")}<span>${d.signoff[1]}</span>${use("rule", "rule")}</div>

        <div class="cards">
          <div class="card power">
            ${plate(PHOTOS.power)}
            ${badge(d)}
            <div class="card-body">
              <div class="kicker">${d.power.kicker}</div>
              <h3>${d.power.title}</h3>
              <ul>${powerItems}</ul>
            </div>
          </div>
          <div class="card conti">
            ${use("corner", "corner tl")}${use("corner", "corner bl")}
            <div class="card-body">
              <h3>${d.conti.title}</h3>
              <div class="conti-list">${contiItems}</div>
            </div>
            ${plate(PHOTOS.conti)}
          </div>
        </div>
      </main>

      <footer class="foot">
        ${footEdge()}
        <div class="foot-inner">
          <div class="motto"><span>${d.motto[0]}</span>${use("gem", "dot")}<span>${d.motto[1]}</span>${use("gem", "dot")}<span>${d.motto[2]}</span></div>
          <div class="contact">
            <span>${use("pin")}<b>${d.venue}</b>${d.address}</span>
            <i class="vline"></i>
            <span>${use("phone")}${d.contactLabel}&nbsp;<span class="phone">${d.phone}</span></span>
          </div>
        </div>
      </footer>
    </section>
    <div class="marks">${cropMarks()}<div class="slug">${d.slug}</div></div>
  </div>`;
}

const params = new URLSearchParams(location.search);
const mode = params.get("mode") === "print" ? "print" : "a4";
const only = params.get("side"); // "en" | "ta" | null
document.body.classList.add("mode-" + mode);
const pageCss = document.createElement("style");
pageCss.textContent = mode === "print"
  ? "@page { size: 236mm 323mm; margin: 0; }"
  : "@page { size: 210mm 297mm; margin: 0; }";
document.head.appendChild(pageCss);

const sides = only ? [MENU[only]] : [MENU.en, MENU.ta];
document.getElementById("root").innerHTML = sides.map(renderPage).join("");

// Once fonts are in, size each seal's ring text so it closes the circle exactly.
Promise.all([...document.fonts].map(f => f.load())).then(() => {
  document.querySelectorAll(".seal-text").forEach(t => {
    const target = parseFloat(t.dataset.len);
    for (let k = 0; k < 4; k++) {
      const len = t.getComputedTextLength();
      const fs = parseFloat(t.getAttribute("font-size"));
      t.setAttribute("font-size", (fs * target / len).toFixed(3));
    }
  });
  window.__ready = true;
});
</script>
